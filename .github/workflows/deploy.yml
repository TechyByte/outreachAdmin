name: Deploy to Bare Metal

on:
  push:
    branches: [ preprod ]  # or 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "${{ secrets.PUBIC_IPV4 }}"
        ssh-keyscan -H ${{ secrets.PUBLIC_IPV4 }} >> ~/.ssh/known_hosts

    - name: Deploy via SSH
      run: |
        ssh ${{ secrets.LOCAL_USERNAME }}@${{ secrets.PUBLIC_IPV4 }} << 'EOF'
          cd /home/github/apps/outreachAdmin
          git pull origin ${{ vars.ENV_NAME }}
          if [ ! -d "venv" ]; then python3 -m venv venv; fi
          source venv/bin/activate
          pip install -r requirements.txt
          sudo /bin/systemctl restart outreach.service
        EOF
