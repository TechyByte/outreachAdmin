{% extends 'base.html' %}

{% block content %}
    <div class="container mt-4">
        <h2>Manage Mail Merge Templates</h2>
        <form method="POST">
            {% include '_mail_merge_template_form.html' %}
            <button type="submit" class="btn btn-primary">Create Template</button>
        </form>

        <h3 class="mt-4">Existing Templates</h3>
        <ul class="list-group">
            {% for template in templates %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ template.name }}
                    <a href="{{ url_for('template_mgmt.edit_mail_template', template_id=template.id) }}" class="btn btn-sm btn-warning">Edit</a>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
