{% extends 'base.html' %}

{% block content %}
    <div class="container mt-4">
        <h2>Send Email</h2>
        <div class="card mb-3">
            <div class="card-header"><b>Draft</b><br />To: {{ recipient_email }}<br />Subject: {{ template.name }}</div>
            <div class="card-body">
                <pre style="white-space: pre-wrap;">{{ generated_content|safe }}</pre>
            </div>
        </div>
        <p>Click the button below to open your email client and send the email. Once sent, confirm below.</p>
        <a href="{{ mailto_link|safe }}" class="btn btn-primary" target="_blank">Open Email Client</a>
        <hr>
        <form method="POST" action="{{ url_for('template_mgmt.confirm_mail_sent') }}">
            <input type="hidden" name="template_id" value="{{ template_id }}">
            <input type="hidden" name="recipient_email" value="{{ recipient_email }}">
            <input type="hidden" name="generated_content" value="{{ generated_content }}">
            <input type="hidden" name="program_id" value="{{ program_id }}">
            <input type="hidden" name="course_id" value="{{ course_id }}">
            <input type="hidden" name="event_id" value="{{ event_id }}">
            <input type="hidden" name="agenda_item_id" value="{{ agenda_item_id }}">
            <button type="submit" class="btn btn-success">Confirm Email Sent</button>
            <a href="{{ request.referrer }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
