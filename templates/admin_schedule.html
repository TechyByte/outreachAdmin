{% extends 'base.html' %}
{% block content %}
<h2>Schedule</h2>

<ul>
{% for event in events %}
    <li>
        <strong>{{ event.date }} - {{ event.name }}</strong> ({{ event.location }})<br>
        <a href="{{ url_for('event_mgmt.edit_event', event_id=event.id) }}">✏️</a>
        {% include '_edit_event_agenda.html' with context %}
    </li>
{% endfor %}
</ul>
{% endblock %}
