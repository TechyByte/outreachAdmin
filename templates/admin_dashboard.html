{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center">Admin Dashboard</h2>
    <p class="text-center">Manage users and their roles.</p>

    <!-- Display Users -->
    <table class="table table-bordered mt-3">
        <thead class="table-dark">
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>
                    <form method="POST" action="{{ url_for('user_mgmt.change_user_type') }}">
                        <input type="hidden" name="user_id" value="{{ user.id }}">
                        <select name="new_role" class="form-select d-inline w-auto">
                            <option value="admin" {% if user.role == "admin" %}selected{% endif %}>Admin</option>
                            <option value="lecturer" {% if user.role == "lecturer" %}selected{% endif %}>Lecturer</option>
                            <option value="school_contact" {% if user.role == "school_contact" %}selected{% endif %}>School Contact</option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm">Update</button>
                    </form>
                </td>
                <td>
                    {% if user.role != 'admin' %}
                        <form method="POST" action="{{ url_for('user_mgmt.delete_user') }}">
                            <input type="hidden" name="user_id" value="{{ user.id }}">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{{ url_for('auth.logout') }}" class="btn btn-secondary">Logout</a>
</div>
{% endblock %}
