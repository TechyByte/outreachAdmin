{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Manage Pupils for {{ school.name }}</h2>

    <form method="POST">
        <div class="mb-3">
            <label for="pupil_name" class="form-label">Pupil Name</label>
            <input type="text" class="form-control" id="pupil_name" name="pupil_name" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Pupil</button>
    </form>

    <hr>

    <h4>Current Pupils</h4>
    <ul class="list-group">
        {% for pupil in school.pupils %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ pupil.name }}
            <form method="POST" action="{{ url_for('school_mgmt.remove_pupil', pupil_id=pupil.id) }}">
                <button class="btn btn-sm btn-danger">Remove</button>
            </form>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
