<div class="mb-3">
    <label for="template_name" class="form-label">Template Name</label>
    <input type="text" class="form-control" id="template_name" name="template_name" value="{{ template.name if template else '' }}" required>
</div>

<div class="mb-3">
    <label for="recipient_type" class="form-label">Recipient Type</label>
    <select class="form-select" id="recipient_type" name="recipient_type" required>
        <option value="lecturer" {% if template and template.recipient_type == 'lecturer' %}selected{% endif %}>Lecturer</option>
        <option value="school_contact" {% if template and template.recipient_type == 'school_contact' %}selected{% endif %}>School Contact</option>
    </select>
</div>
<div class="mb-3">
    <label for="template_type" class="form-label">Template Type</label>
    <select class="form-select" id="template_type" name="template_type" required onchange="updateTemplateTypeFields()">
        <option value="template_course" {% if template and template.template_courses %}selected{% endif %}>Template Course</option>
        <option value="template_event" {% if template and template.template_events %}selected{% endif %}>Template Event</option>
        <option value="template_agenda_item" {% if template and template.template_agenda_items %}selected{% endif %}>Template Agenda Item</option>
    </select>
</div>
<div class="mb-3">
    <label for="sendable_statuses" class="form-label">Sendable Statuses</label>
    <select class="form-select" id="sendable_statuses" name="sendable_statuses" multiple>
        <!-- Status options will be dynamically updated based on the selected template type -->
    </select>
</div>
<div class="mb-3 d-none" id="template_course_field">
    <label for="template_course_ids" class="form-label">Assign to Template Courses</label>
    <select class="form-select" id="template_course_ids" name="template_course_ids" multiple>
        {% for course in template_courses %}
            <option value="{{ course.id }}" {% if template and course in template.template_courses %}selected{% endif %}>{{ course.name }}</option>
        {% endfor %}
    </select>
</div>
<div class="mb-3 d-none" id="template_event_field">
    <label for="template_event_ids" class="form-label">Assign to Template Events</label>
    <select class="form-select" id="template_event_ids" name="template_event_ids" multiple>
        {% for event in template_events %}
            <option value="{{ event.id }}" {% if template and event in template.template_events %}selected{% endif %}>{{ event.name }}</option>
        {% endfor %}
    </select>
</div>
<div class="mb-3 d-none" id="template_agenda_item_field">
    <label for="template_agenda_item_ids" class="form-label">Assign to Template Agenda Items</label>
    <select class="form-select" id="template_agenda_item_ids" name="template_agenda_item_ids" multiple>
        {% for agenda_item in template_agenda_items %}
            <option value="{{ agenda_item.id }}" {% if template and agenda_item in template.template_agenda_items %}selected{% endif %}>{{ agenda_item.title }}</option>
        {% endfor %}
    </select>
</div>
<div class="mb-3">
    <label for="placeholders" class="form-label">Available Placeholders</label>
    <ul id="placeholders" class="list-group">
        <!-- Placeholders will be dynamically updated based on the selected template type -->
    </ul>
</div>
<div class="mb-3">
    <label for="content" class="form-label">Content</label>
    <textarea class="form-control" id="content" name="content" rows="5" required>{{ template.content if template else '' }}</textarea>
</div>

<script>
    const statusesByType = {
        program: [],  // Program has no statuses, so it's always sendable
        template_course: {{ course_statuses | safe }},
        template_event: {{ event_statuses | safe }},
        template_agenda_item: {{ agenda_item_statuses | safe }}
    };

        const placeholdersByType = {
        program: ["{\{program.name}}", "{\{program.schools}}"],
        template_course: ["{\{course.name}}", "{\{course.events}}", "{\{event.name}}", "{\{event.date}}", "{\{event.location}}"],
        template_event: ["{\{event.name}}", "{\{event.date}}", "{\{event.start_time}}", "{\{event.agenda_items}}"],
        template_agenda_item: ["{\{agenda_item.title}}", "{\{agenda_item.time}}", "{\{agenda_item.duration}}"]
    };

    function updatePlaceholders() {
        const type = document.getElementById('template_type').value;
        const placeholders = placeholdersByType[type] || [];
        const placeholdersList = document.getElementById('placeholders');
        placeholdersList.innerHTML = ''; // Clear existing placeholders
        placeholders.forEach(placeholder => {
            const li = document.createElement('li');
            li.className = 'list-group-item';
            li.textContent = placeholder;
            placeholdersList.appendChild(li);
        });
    }

    function updateTemplateTypeFields() {
        const type = document.getElementById('template_type').value;

        // Update visibility of fields
        document.getElementById('program_field').classList.toggle('d-none', type !== 'program');
        document.getElementById('template_course_field').classList.toggle('d-none', type !== 'template_course');
        document.getElementById('template_event_field').classList.toggle('d-none', type !== 'template_event');
        document.getElementById('template_agenda_item_field').classList.toggle('d-none', type !== 'template_agenda_item');

        // Update sendable statuses
        const sendableStatuses = document.getElementById('sendable_statuses');
        sendableStatuses.innerHTML = ''; // Clear existing options
        if (statusesByType[type]) {
            Object.keys(statusesByType[type]).forEach(status => {
                const option = document.createElement('option');
                option.value = status;
                option.textContent = statusesByType[type][status];
                {% if template %}
                if ({{ template.sendable_statuses | tojson }}.includes(status)) {
                    option.selected = true;
                }
                {% endif %}
                sendableStatuses.appendChild(option);
            });
        }
    }

    // Initialize the statuses on page load
    document.addEventListener('DOMContentLoaded', updateTemplateTypeFields);
    document.addEventListener('DOMContentLoaded', updatePlaceholders);
    document.getElementById('template_type').addEventListener('change', updatePlaceholders);
</script>
