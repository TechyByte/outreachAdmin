{% extends 'base.html' %}
{% block content %}
<h2>Edit Agenda Item</h2>
<form method="post">
    <label>Title: <input type="text" name="title" value="{{ item.title }}"></label><br>
    <label>Description: <textarea name="description">{{ item.description }}</textarea></label><br>
    <label>Time: <input type="time" name="time" value="{{ item.time }}"></label><br>
    <label>Duration (minutes): <input type="number" name="duration" value="{{ item.duration.seconds // 60 }}"></label><br>
    <label>Lecturer:
        <select name="lecturer_id">
            <option value="">-- None --</option>
            {% for lecturer in lecturers %}
                <option value="{{ lecturer.id }}" {% if item.lecturer_id == lecturer.id %}selected{% endif %}>{{ lecturer.username }}</option>
            {% endfor %}
        </select>
    </label><br>
    <label><input type="checkbox" name="lecturer_confirmed" {% if item.lecturer_confirmed %}checked{% endif %}> Lecturer Confirmed</label><br>
    <button type="submit">Save</button>
</form>
{% endblock %}
