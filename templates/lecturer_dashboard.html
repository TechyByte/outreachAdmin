{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center">Lecturer Dashboard</h2>
    <p class="text-center">Manage your assigned agenda items.</p>

    <!-- Display Agenda Items -->
    <table class="table table-bordered mt-3">
        <thead class="table-dark">
            <tr>
                <th>Agenda Item</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for agenda_item in agenda_items %}
            <tr>
                <td>{{ agenda_item.title }}</td>
                <td>
                    <form method="POST" action="{{ url_for('edit_agenda_item') }}">
                        <input type="hidden" name="agenda_item_id" value="{{ agenda_item.id }}">
                        <input type="text" name="new_title" placeholder="New Title" class="form-control d-inline w-50">
                        <button type="submit" class="btn btn-warning btn-sm">Edit</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{{ url_for('logout') }}" class="btn btn-secondary">Logout</a>
</div>
{% endblock %}
